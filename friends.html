<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Shroombrew Friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script><script src="app.js"></script>
<script src="https://shroombrew.3-72-19-139.sslip.io/oss/serv/games.js"></script></head>
<body><div class="wrap">
<header class="top"><h1 data-i18n="f_title">Friends & Rewards</h1><div class="rule"></div>
<nav id="nav" data-page="friends"></nav></header>

<div id="msg"></div>

<div id="needlink" class="box" style="display:none"><p data-i18n="f_need_link">Link your Wii to use this page.</p>
  <a class="btn main" href="link.html" data-i18n="f_go_link">Link now</a></div>

<div id="main" style="display:none">
<div class="box">
  <p data-i18n="f_code">Your friend code</p>
  <p><b id="code" class="big">...</b> <button id="copy" class="sm" data-i18n="f_copy">Copy</button></p>
  <p class="muted" data-i18n="f_share"></p>
  <p><span data-i18n="f_level">Reward level</span>: <b id="tier"></b> (<span id="refs">0</span> <span data-i18n="f_refs"></span>)
     &nbsp; <b id="points">0</b> <span data-i18n="f_points">Wii Points</span></p>
  <p class="muted" data-i18n="f_tiers"></p>
</div>

<div class="box" id="redeemBox">
  <h2 data-i18n="f_enter">Enter a friend's code</h2>
  <input id="rcode" maxlength="14" size="18" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase">
  <button id="redeem" class="main" data-i18n="f_redeem">Redeem</button>
</div>

<div class="box"><h2 data-i18n="f_in">Gifts for you</h2><div id="incoming"></div></div>
<div class="box"><h2 data-i18n="f_out">Gifts you sent</h2><div id="outgoing"></div></div>

<div class="box"><h2 data-i18n="f_send">Send a gift</h2>
  <p class="muted" data-i18n="f_send_p"></p>
  <p><label><span data-i18n="f_friend_code">Friend's code</span><br><input id="gcode" maxlength="14" size="18" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase"></label></p>
  <p><label><span data-i18n="f_app">App</span><br><select id="gapp" style="max-width:100%"></select></label></p>
  <p><label><span data-i18n="f_msg">Message (optional)</span><br><input id="gmsg" maxlength="120" size="40"></label></p>
  <button id="gsend" class="main" data-i18n="f_send_btn">Send gift</button>
</div>

<div class="box"><h2 data-i18n="f_updates">Updates available</h2><div id="updates"></div></div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i);};
var data=null;
function btn(label,fn){var b=document.createElement("button");b.className="sm";b.textContent=label;b.onclick=fn;b.style.marginRight="6px";return b;}

function giftRow(g,incoming){
  var p=document.createElement("p");
  var s=document.createElement("b");s.textContent=g.name;p.appendChild(s);
  p.appendChild(document.createTextNode(" ("+g.price+") "+I18N.t(incoming?"f_from":"f_to")+" "+g.other+(g.message?' - "'+g.message+'" ':" ")));
  p.appendChild(document.createElement("br"));
  var act=function(action){return function(){App.call("POST","gift/"+action,{id:g.id},function(st,d){if(st===200)load();else App.say(App.errText(d),true);});};};
  if(incoming){p.appendChild(btn(I18N.t("f_accept"),act("accept")));p.appendChild(btn(I18N.t("f_decline"),act("decline")));}
  else p.appendChild(btn(I18N.t("f_cancel"),act("cancel")));
  return p;
}
function empty(el,key){var e=document.createElement("p");e.className="muted";e.textContent=I18N.t(key);el.appendChild(e);}

function render(){
  if(!data)return;
  $("code").textContent=data.code;
  $("tier").textContent=data.tier||I18N.t("f_none");
  $("refs").textContent=data.referrals;
  $("points").textContent=data.points;
  $("redeemBox").style.display=data.referred?"none":"block";
  var inc=$("incoming"),out=$("outgoing"),up=$("updates");
  App.clear(inc);App.clear(out);App.clear(up);
  if(!data.incoming.length)empty(inc,"f_nogifts");
  data.incoming.forEach(function(g){inc.appendChild(giftRow(g,true));});
  if(!data.outgoing.length)empty(out,"f_nogifts");
  data.outgoing.forEach(function(g){out.appendChild(giftRow(g,false));});
  if(!data.updates.length)empty(up,"f_noupdates");
  data.updates.forEach(function(u){
    var p=document.createElement("p");p.appendChild(document.createTextNode(u.name+" (v"+u.installed+" → v"+u.latest+") "));
    var a=document.createElement("a");a.href="https://shroombrew.3-72-19-139.sslip.io/download/"+encodeURIComponent(u.slug);a.textContent=I18N.t("f_update_btn");p.appendChild(a);up.appendChild(p);});
}

function load(){App.call("GET","me",null,function(st,d){
  if(st===200&&d.linked){$("needlink").style.display="none";$("main").style.display="block";data=d;render();}
  else{$("main").style.display="none";$("needlink").style.display="block";}
});}

function fillApps(){
  var sel=$("gapp");App.clear(sel);
  var o=document.createElement("option");o.value="";o.textContent=I18N.t("f_choose");sel.appendChild(o);
  var list=(window.gameslist||[]).filter(function(g){return g.id&&g.link&&g.link.indexOf("/download/")===0;}).sort(function(a,b){return a.title1.localeCompare(b.title1);});
  list.forEach(function(g){var op=document.createElement("option");op.value=g.link.slice(10);op.textContent=g.title1;sel.appendChild(op);});
  var m=location.hash.match(/gift=([^&]+)/);if(m)sel.value=decodeURIComponent(m[1]);
}

$("copy").onclick=function(){App.copyText($("code").textContent,function(){$("copy").textContent=I18N.t("f_copied");setTimeout(function(){$("copy").textContent=I18N.t("f_copy");},1500);});};
$("redeem").onclick=function(){
  App.call("POST","referral",{code:$("rcode").value},function(st,d){
    if(st===200){App.say(I18N.t("f_done",{n:d.reward}));load();}else App.say(App.errText(d),true);});
};
$("gsend").onclick=function(){
  App.call("POST","gift/send",{to:$("gcode").value,slug:$("gapp").value,message:$("gmsg").value},function(st,d){
    if(st===200){App.say(I18N.t("f_sent"));$("gmsg").value="";load();}else App.say(App.errText(d),true);});
};

I18N.ready(function(){fillApps();load();I18N.onChange=function(){fillApps();render();};});
})();
</script>
</div></body></html>
